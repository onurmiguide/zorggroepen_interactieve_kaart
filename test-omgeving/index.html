<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Zorgtool testomgeving - MiGuide</title>
  <link rel="icon" type="image/svg+xml" href="/zg-data/map-find-search-svgrepo-com.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="zorgtool.css?v=20261016-5" />
  <script>
    // Thema direct zetten (voorkomt flitsen); zelfde voorkeur als de rest van de site.
    try {
      const t = localStorage.getItem("miguide_theme");
      if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="map" class="map" role="region" aria-label="Kaart met zorggroepen"></div>

  <aside id="panel" class="panel" aria-label="Zoeken en resultaat">
    <button type="button" id="sheetHandle" class="sheet-handle" aria-label="Paneel groter of kleiner maken"></button>

    <header class="panel-head">
      <img class="logo logo-light" src="/zg-data/MiGuide_Logo_Nieuw.png" alt="MiGuide" />
      <img class="logo logo-dark" src="/zg-data/MiGuide_Logo_White.png" alt="MiGuide" />
      <span class="app-name">Zorgtool</span>
      <div class="head-actions">
        <button type="button" id="themeBtn" class="icon-btn" aria-label="Donkere modus aan of uit">Thema</button>
        <button type="button" id="menuBtn" class="icon-btn" aria-haspopup="true" aria-expanded="false" aria-controls="menu">Menu</button>
        <ul id="menu" class="menu" hidden>
          <li><a href="/test-omgeving/" aria-current="page">Zorgtool (test)</a></li>
          <li><a href="/index.html#zorgtool">Zorgtool (huidig)</a></li>
          <li><a href="/alle-zorggroepen.html">Zorggroep kaart</a></li>
          <li><a href="/updates.html">Updates</a></li>
          <li><a href="/documentatie.html">Documentatie</a></li>
          <li><a href="/admin/">Admin</a></li>
        </ul>
      </div>
    </header>

    <div class="panel-scroll">
      <form id="searchForm" class="search" role="search" autocomplete="off" novalidate>
        <label class="label" for="q">Postcode of gemeente</label>
        <div class="combo">
          <input id="q" class="field" type="text" inputmode="text" spellcheck="false"
                 placeholder="1234 AB of plaatsnaam"
                 role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest" />
          <ul id="suggest" class="suggest" role="listbox" aria-label="Suggesties" hidden></ul>
        </div>

        <label class="label field-gap" for="insurer">Zorgverzekeraar</label>
        <select id="insurer" class="field">
          <option value="ALL">Alle zorgverzekeraars</option>
        </select>

        <div class="actions">
          <button type="submit" class="btn btn-primary">Zoeken</button>
          <button type="button" id="resetBtn" class="btn btn-secondary">Wissen</button>
        </div>
      </form>

      <div id="result" aria-live="polite"></div>

      <details id="filters" class="section more">
        <summary>Filters voor de kaart</summary>
        <label class="label field-gap" for="filterZorggroep">Zorggroep</label>
        <select id="filterZorggroep" class="field"><option value="ALL">Alle zorggroepen</option></select>
        <label class="label field-gap" for="filterStroom">Facturatiestroom</label>
        <select id="filterStroom" class="field"><option value="ALL">Alle facturatiestromen</option></select>
      </details>
    </div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="zorgtool.js?v=20261016-6"></script>
</body>
</html>
